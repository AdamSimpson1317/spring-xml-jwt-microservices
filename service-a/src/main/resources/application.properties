spring.application.name=service-a
server.port=8080

service-b.url=http://localhost:8081

service-b.retry.max-attempts=3
service-b.retry.delay-ms=2000

service-b.http.connect-timeout-ms=2000
service-b.http.request-timeout-ms=5000

logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level \
  [correlationId=%X{correlationId:-none}] %logger{36} - %msg%n

resilience4j.circuitbreaker.instances.serviceB.sliding-window-size=2
resilience4j.circuitbreaker.instances.serviceB.minimum-number-of-calls=2
resilience4j.circuitbreaker.instances.serviceB.failure-rate-threshold=50
resilience4j.circuitbreaker.instances.serviceB.wait-duration-in-open-state=10s
resilience4j.circuitbreaker.instances.serviceB.permitted-number-of-calls-in-half-open-state=1

management.endpoints.web.exposure.include=health,metrics
management.endpoint.health.show-details=always